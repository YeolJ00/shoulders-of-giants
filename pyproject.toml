[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lsim"
version = "0.0.1"
description = "A learned household simulator: a generative model over meshes, distilled from a classical simulator and fine-tuned on real motion."
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]
